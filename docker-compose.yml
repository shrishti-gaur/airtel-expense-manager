version: "3.9"

services:
  server:
    build: ./server
    container_name: airtel-server-container
    ports:
      - "8000:8000"
    env_file:
      - ./server/.env
    volumes:
      - ./server/uploads:/app/src/uploads

  client:
    build: ./client
    container_name: airtel-client-container
    ports:
      - "5174:5174"
    env_file:
      - ./client/.env
    depends_on:
      - server